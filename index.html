<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobTailor - AI Resume & Cover Letter Optimizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-4xl mx-auto p-6">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-indigo-600">JobTailor</h1>
      <p class="text-gray-600">Paste a job description + your resume → Get a perfectly tailored version in seconds</p>
      <p class="text-sm text-amber-600 mt-2">Freemium: 2 free tailors/day. Unlimited on Pro ($9/mo)</p>
    </header>

    <div class="grid md:grid-cols-2 gap-6">
      <div>
        <label class="block font-medium mb-2">Job Description</label>
        <textarea id="jobDesc" class="w-full h-48 p-3 border rounded-lg" placeholder="Paste the full job posting here..."></textarea>
      </div>
      <div>
        <label class="block font-medium mb-2">Your Current Resume</label>
        <textarea id="resume" class="w-full h-48 p-3 border rounded-lg" placeholder="Paste your resume text here..."></textarea>
      </div>
    </div>

    <div class="mt-6 text-center">
      <button id="tailorBtn" class="bg-indigo-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-indigo-700">
        Tailor My Resume (Uses AI)
      </button>
      <p class="text-xs text-gray-500 mt-2">Enter your OpenAI/Anthropic API key below for production, or use demo mode</p>
      <input type="password" id="apiKey" class="mt-2 p-2 border rounded w-full max-w-md" placeholder="Optional: sk-... (stored locally)">
    </div>

    <div id="output" class="mt-8 hidden">
      <h2 class="text-xl font-bold mb-4">Tailored Resume</h2>
      <div id="result" class="bg-white p-6 border rounded-lg whitespace-pre-wrap"></div>
      <button id="copyBtn" class="mt-4 bg-green-600 text-white px-4 py-2 rounded">Copy to Clipboard</button>
      <button id="coverBtn" class="mt-4 ml-2 bg-purple-600 text-white px-4 py-2 rounded">Generate Cover Letter</button>
    </div>
  </div>

  <script>
    const FREE_DAILY = 2;
    let usage = parseInt(localStorage.getItem('jt_usage') || '0');
    let lastReset = localStorage.getItem('jt_date') || '';
    const today = new Date().toDateString();
    if (lastReset !== today) {
      usage = 0;
      localStorage.setItem('jt_date', today);
      localStorage.setItem('jt_usage', '0');
    }

    document.getElementById('tailorBtn').onclick = async () => {
      const job = document.getElementById('jobDesc').value.trim();
      const res = document.getElementById('resume').value.trim();
      const key = document.getElementById('apiKey').value.trim();

      if (!job || !res) return alert('Please fill both fields');

      if (usage >= FREE_DAILY && !localStorage.getItem('jt_premium')) {
        alert('Free limit reached today. Upgrade to Pro for unlimited!');
        return;
      }

      document.getElementById('tailorBtn').textContent = 'Tailoring...';
      document.getElementById('tailorBtn').disabled = true;

      let tailored;
      if (key) {
        tailored = await callAI(key, job, res);
      } else {
        tailored = `[DEMO MODE - Add API key for real AI]\n\nTAILORED RESUME based on job keywords:\n\n${res}\n\n--- KEYWORD MATCHES FROM JOB ---\n${extractKeywords(job).join(', ')}\n\nSuggested additions: Highlight experience matching the above terms.`;
      }

      document.getElementById('result').textContent = tailored;
      document.getElementById('output').classList.remove('hidden');
      usage++;
      localStorage.setItem('jt_usage', usage);
      document.getElementById('tailorBtn').textContent = 'Tailor My Resume (Uses AI)';
      document.getElementById('tailorBtn').disabled = false;
    };

    function extractKeywords(text) {
      const words = text.toLowerCase().match(/\b[a-z]{4,}\b/g) || [];
      const stop = new Set(['with','from','that','this','have','will','your','about','more','some']);
      const freq = {};
      words.forEach(w => { if (!stop.has(w)) freq[w] = (freq[w]||0)+1; });
      return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
    }

    async function callAI(apiKey, job, resume) {
      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: 'gpt-4o-mini',
          messages: [{
            role: 'user',
            content: `You are an expert resume writer. Tailor the following resume to perfectly match the job description. Optimize for ATS, add relevant keywords naturally, quantify achievements where possible, keep the same structure. Output only the tailored resume text.\n\nJOB DESCRIPTION:\n${job}\n\nRESUME:\n${resume}`
          }]
        })
      });
      const data = await response.json();
      return data.choices?.[0]?.message?.content || 'Error generating. Check API key and billing.';
    }

    document.getElementById('copyBtn').onclick = () => {
      navigator.clipboard.writeText(document.getElementById('result').textContent);
      alert('Copied!');
    };

    document.getElementById('coverBtn').onclick = async () => {
      alert('Cover letter generation coming in Pro version / implement similarly.');
    };
  </script>
</body>
</html>
